<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모아페이 | 프로젝트 업무센터</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#26334d;background:#f6f4ef}*{box-sizing:border-box}body{margin:0}header{height:78px;padding:18px 28px;background:#1d3152;color:#f8f5ef;display:flex;align-items:center;justify-content:space-between}a{color:#355d9e}header a:focus-visible{outline-color:#e4bd83}header strong{font-size:24px}a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #466eae;outline-offset:3px} .skip{position:absolute;left:16px;top:-70px;background:white;color:#26334d;padding:10px;z-index:50}.skip:focus{top:8px}header small{display:block;color:#c5d3eb;margin-top:4px}.layout{display:grid;grid-template-columns:224px 1fr;min-height:calc(100vh - 78px)}nav{background:white;padding:24px 14px;border-right:1px solid #d8dde5}nav button{display:block;text-align:left;width:100%;margin:4px 0;border:0;background:none;color:#3e4e69}nav button.active{background:#ebf0f8;color:#284a82;font-weight:700}main{padding:28px;min-width:0}h1{margin:0 0 8px;font-size:28px}p{line-height:1.65}.sub{color:#626d7f;font-size:14px}.panel{background:#fffefb;border:1px solid #d8dde5;border-radius:12px;padding:20px;margin-top:20px}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,button,textarea{font:inherit;border:1px solid #8391a9;border-radius:6px;padding:10px}button{cursor:pointer;background:white}button.primary{background:#355d9e;border-color:#355d9e;color:white}button.primary:hover{background:#284a82;border-color:#284a82}button:disabled{opacity:.4;cursor:default}input{min-width:100px}input.search{flex:1;min-width:220px}label{font-size:13px;color:#56647b}.scroll{overflow:auto;max-height:62vh}table{border-collapse:collapse;white-space:nowrap;width:100%;font-size:13px}th{position:sticky;top:0;background:#ebf0f8;text-align:left;color:#56647b}td,th{border-bottom:1px solid #e0e5ed;padding:12px 14px}tr:hover td{background:#f0f3f9}td.wrap{white-space:normal;min-width:240px;max-width:420px}a.link{color:#355d9e;cursor:pointer;text-decoration:underline}textarea{width:100%;min-height:145px;font-family:ui-monospace,monospace;background:#1d3152;color:#edf2fa;resize:vertical}.badge{background:#e2eaf7;color:#284a82;border-radius:20px;padding:8px 14px;font-size:13px}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.error{color:#a92335;white-space:pre-wrap}.empty{padding:50px;color:#626d7f;text-align:center}dialog{width:min(1000px,92vw);max-height:86vh;border:1px solid #ccd5e2;border-radius:14px;padding:28px}dialog::backdrop{background:#172b4d80}.doc{white-space:pre-wrap;line-height:1.9}#sqlpane,#schema{display:none}pre{white-space:pre-wrap;word-break:break-word;font-size:13px}footer{font-size:12px;color:#626d7f;margin-top:18px}@media(max-width:800px){.layout{grid-template-columns:1fr}nav{display:flex;overflow:auto;padding:8px}nav button{white-space:nowrap;width:auto}main{padding:16px}.tools input{width:100%}header{padding:12px 16px;height:auto;flex-wrap:wrap;gap:12px}}
</style>
<a class="skip" href="#workspace">본문으로 바로가기</a><header><div><strong>모아페이</strong><small>PROJECT OPERATIONS · 금융 PM 실습 업무센터</small></div><a href="/learn" style="color:white">교재 따라 실습하기 →</a><span id="stage" class="badge"></span></header>
<div class="layout"><nav id="nav"></nav><main id="workspace"><h1 id="title">원천 문서</h1><div class="sub" id="subtitle"></div>
<section id="listpane" class="panel"><form id="filters"><div class="tools"><input id="q" class="search" aria-label="통합검색" placeholder="문서, 담당자, 거래번호를 검색하세요"><button class="primary">조회</button><button type="button" id="clear">초기화</button><button type="button" id="export">CSV 내보내기</button></div><div class="tools" style="margin-top:12px"><label>정확히 일치</label><select id="field" aria-label="첫째 조건"></select><input id="value" aria-label="첫째 조건값" placeholder="조건값"><select id="field2" aria-label="둘째 조건"></select><input id="value2" aria-label="둘째 조건값" placeholder="조건값"></div></form><p class="sub" id="count"></p><div id="results" class="scroll"></div><div class="pager"><button id="prev">이전 50건</button><span id="page"></span><button id="next">다음 50건</button></div></section>
<section class="panel" id="sqlpane"><p>현재 시점의 자료만 조회합니다. 결과는 최대 1,000행입니다. 금액은 원 단위이며 전표의 양수는 차변, 음수는 대변입니다.</p><select id="samples" aria-label="예제 쿼리"><option value="SELECT * FROM v_대사조회 WHERE 판정='불일치';">대사 불일치 찾기</option><option value="SELECT * FROM v_프로젝트원가;">프로젝트 비용 집계</option><option value="SELECT * FROM v_조달조회;">발주·검수·청구·지급 비교</option><option value="SELECT * FROM v_예산조회;">기준선 버전 비교</option><option value="SELECT saknr, SUM(hsl) AS 잔액 FROM acdoca GROUP BY saknr;">계정별 잔액</option></select><p><textarea id="sql" aria-label="SQL 입력">SELECT * FROM v_대사조회 WHERE 판정='불일치';</textarea></p><button class="primary" id="run">SQL 실행</button><p id="sqlstatus" role="status"></p><div id="sqlresult" class="scroll"></div></section>
<section class="panel" id="schema"></section><p id="error" class="error" role="alert"></p><footer>교육용 가상 데이터 · SAP S/4HANA 업무구조 참고 · 기존 회사 및 실제 고객 정보와 무관</footer></main></div>
<dialog id="detail"><button id="close" style="float:right">닫기</button><div id="detailbody"></div></dialog>
<script src="/app.js"></script>
<script>
const $=s=>document.querySelector(s);let meta,menu='documents',offset=0,columns=[],generation=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=PMApp.api;
function cell(v,col){if(v===null)return '—';if(typeof v==='number')return v.toLocaleString('ko-KR');if(/^S\d\d$/.test(String(v)))return `<a class="link" data-doc="${esc(v)}">${esc(v)}</a>`;const dest=/^ST\d+$/.test(String(v))?'settlements':/^P\d{2}$/.test(String(v))?'people':/^PO\d+$/.test(String(v))?'procurement':/^TX\d+$/.test(String(v))?'reconciliation':null;if(dest)return `<a class="link" data-related="${dest}" data-id="${esc(v)}">${esc(v)}</a>`;return esc(v)}
function renderTable(cols,rows,click){if(!rows.length)return '<div class="empty">현재 시점·조건에 해당하는 자료가 없습니다.</div>';return '<table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map((r,i)=>'<tr>'+cols.map((c,j)=>{let v=Array.isArray(r)?r[j]:r[c];return '<td class="'+(['body','acceptance','authority','interest'].includes(c)?'wrap':'')+'">'+(click&&c===meta.keys[menu]?`<a class="link" data-row="${i}">${esc(v)}</a>`:cell(c==='body'?String(v).slice(0,120)+'…':v,c))+'</td>'}).join('')+'</tr>').join('')+'</tbody></table>'}
function bindDocs(root){root.querySelectorAll('[data-doc]').forEach(a=>a.onclick=()=>showDetail('documents',a.dataset.doc));root.querySelectorAll('[data-related]').forEach(a=>a.onclick=()=>showDetail(a.dataset.related,a.dataset.id))}
function params(){return new URLSearchParams({menu,q:$('#q').value,field:$('#field').value,value:$('#value').value,field2:$('#field2').value,value2:$('#value2').value,offset})}
async function load(resetFields=false){const id=++generation;try{const d=await api('/api/list?'+params());if(id!==generation)return;columns=d.columns;if(resetFields){for(const field of ['#field','#field2'])$(field).innerHTML='<option value="">조건 항목 선택</option>'+columns.filter(c=>c!=='body').map(c=>`<option>${esc(c)}</option>`).join('')}$('#results').innerHTML=renderTable(columns,d.rows,true);$('#count').textContent=`검색 결과 ${d.total.toLocaleString()}건 · 최대 50건씩 표시`+(Object.keys(d.summary||{}).length?' | '+Object.entries(d.summary).map(([k,v])=>k+' '+v.toLocaleString()+'원').join(' · '):'');$('#page').textContent=d.total?`${offset+1}–${Math.min(offset+50,d.total)} / ${d.total}`:'0건';$('#prev').disabled=offset===0;$('#next').disabled=offset+50>=d.total;$('#results').querySelectorAll('[data-row]').forEach(a=>a.onclick=()=>showDetail(menu,d.rows[Number(a.dataset.row)][meta.keys[menu]]));bindDocs($('#results'));$('#error').textContent=''}catch(e){$('#error').textContent=e.message}}
async function showDetail(k,v){try{const d=await api('/api/detail?'+new URLSearchParams({menu:k,id:v}));let out='<h2>'+esc(v)+' 상세·연관 기록</h2>';if(d.document){const x=d.document;out+=`<h3>${esc(x.title)}</h3><p class="sub">${esc(x.release_stage)} · 버전 ${esc(x.version)} · 작성 ${esc(x.author_id)} / 검토 ${esc(x.reviewer_id)} / 확인 ${esc(x.approver_id)}</p><div class="doc">${esc(x.body)}</div>`}else if(Object.hasOwn(d,'document'))out+='<p>이 문서는 현재 자료 단계에 없습니다. 교재의 공개 시점을 확인하세요.</p>';else for(const [n,r] of Object.entries(d))out+='<h3>'+esc(n)+'</h3><div class="scroll">'+renderTable(r.length?Object.keys(r[0]):[],r,false)+'</div>';if(!Object.keys(d).length)out+='<p>상세 연결은 문서·요구사항·전표·조달·정산 메뉴에서 제공합니다.</p>';$('#detailbody').innerHTML=out;bindDocs($('#detailbody'));if(!$('#detail').open)$('#detail').showModal()}catch(e){$('#error').textContent=e.message}}
async function select(k){menu=k;offset=0;for(const s of ['#q','#value','#value2'])$(s).value='';$('#field').innerHTML='';$('#field2').innerHTML='';$('#listpane').style.display=k==='sql'||k==='schema'?'none':'block';$('#sqlpane').style.display=k==='sql'?'block':'none';$('#schema').style.display=k==='schema'?'block':'none';$('#title').textContent=meta.menu[k]||(k==='sql'?'SQL 조회':'데이터 사전');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.menu===k));if(k==='schema')$('#schema').innerHTML='<p>읽기 전용 테이블·뷰 정의. 한글 뷰부터 조회한 뒤 원천 테이블과 연결하세요.</p>'+meta.schema.map(s=>'<details><summary>'+esc(s.name)+' · '+esc(s.type)+'</summary><pre>'+esc(s.sql)+'</pre></details>').join('');else if(k!=='sql')return load(true)}
$('#filters').onsubmit=e=>{e.preventDefault();offset=0;load()};$('#clear').onclick=()=>select(menu);$('#prev').onclick=()=>{offset-=50;load()};$('#next').onclick=()=>{offset+=50;load()};$('#export').onclick=async()=>{try{const p=params();p.set('format','csv');await PMApp.exportCSV(p,menu+'.csv')}catch(e){$('#error').textContent=e.message}};$('#close').onclick=()=>$('#detail').close();$('#samples').onchange=()=>$('#sql').value=$('#samples').value;
$('#run').onclick=async()=>{try{$('#run').disabled=true;const d=await api('/api/sql',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sql:$('#sql').value})});$('#sqlresult').innerHTML=renderTable(d.columns,d.rows,false);bindDocs($('#sqlresult'));$('#sqlstatus').textContent=`${d.rows.length}행${d.truncated?' · 1,000행 제한으로 일부만 표시':''}`}catch(e){$('#sqlstatus').textContent=e.message;$('#sqlresult').innerHTML=''}finally{$('#run').disabled=false}};
api('/api/meta').then(async d=>{meta=d;$('#stage').textContent=d.stage+' · '+d.label;$('#subtitle').textContent='MP-01 정산 개선 프로젝트 · 자료 기준 '+d.as_of+' · 읽기 전용';$('#nav').innerHTML=Object.entries({...d.menu,sql:'SQL 조회',schema:'데이터 사전'}).map(([k,v])=>`<button data-menu="${k}">${v}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>select(b.dataset.menu));const p=new URLSearchParams(location.search),requested=p.get('menu'),k=Object.hasOwn(d.menu,requested)||['sql','schema'].includes(requested)?requested:'documents';await select(k);let filtered=false;for(const key of ['q','field','value','field2','value2']){if(p.has(key)){const value=p.get(key);if((key==='field'||key==='field2')&&!columns.includes(value))throw Error('안내 링크의 조건 항목을 확인하세요.');$('#'+key).value=value;filtered=true}}if(filtered)await load()}).catch(e=>$('#error').textContent=e.message);
</script></html>
