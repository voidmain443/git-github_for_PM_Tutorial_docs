<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 921" role="img" aria-labelledby="u5-risk-title u5-risk-desc" lang="ko"><title id="u5-risk-title">위험 분석을 대응 업무로 연결하기</title><desc id="u5-risk-desc">위험 식별 · D25：원인 → 불확실 사건 → 영향、확률·영향·책임을 기록。 정성 분석：확률 × 영향등급、먼저 점검할 순위 결정。 정량 분석 · D26：독립 가정의 네 경우、확률 × 손실 금액을 합산、평균과 최대손실을 구분。 대응 계획：책임·발생 신호·예방조치、일정·예산 반영 여부 검토。 실행 후 재평가：실행 증거로 잔여 위험 확인、최초 평가도 함께 보존。 발생한 사건은 이슈：발생 사실·영향·조치、D03에서 담당·기한 추적。위험 식별 · D25 → 정성 분석：무엇부터 볼까。 위험 식별 · D25 → 정량 분석 · D26：노출은 얼마일까。 정성 분석 → 대응 계획：우선순위。 정량 분석 · D26 → 대응 계획：예비비 근거。 대응 계획 → 실행 후 재평가：실행 증거 수신 후。 실행 후 재평가 → 발생한 사건은 이슈：발생이 확인되면。</desc><defs><marker id="u5-risk-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="420.0,175 420.0,221.0 248.0,221.0 248.0,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u5-risk-arrow)"/><polyline points="420.0,175 420.0,221.0 592.0,221.0 592.0,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u5-risk-arrow)"/><polyline points="248.0,411 248.0,457.0 420.0,457.0 420.0,503" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u5-risk-arrow)"/><polyline points="592.0,411 592.0,457.0 420.0,457.0 420.0,503" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u5-risk-arrow)"/><polyline points="420.0,622 420.0,690.0 248.0,690.0 248.0,758" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u5-risk-arrow)"/><polyline points="398.0,817.5 442.0,817.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u5-risk-arrow)"/><rect x="270.0" y="56" width="300" height="119" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="286.0" y="87" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">위험 식별 · D25</text><text x="286.0" y="122" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">원인 → 불확실 사건 → 영향</text><text x="286.0" y="147" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">확률·영향·책임을 기록</text><rect x="98.0" y="267" width="300" height="144" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="114.0" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">정성 분석</text><text x="114.0" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">확률 × 영향등급</text><text x="114.0" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">먼저 점검할 순위 결정</text><rect x="442.0" y="267" width="300" height="144" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="458.0" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">정량 분석 · D26</text><text x="458.0" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">독립 가정의 네 경우</text><text x="458.0" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">확률 × 손실 금액을 합산</text><text x="458.0" y="383" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">평균과 최대손실을 구분</text><rect x="270.0" y="503" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="286.0" y="534" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">대응 계획</text><text x="286.0" y="569" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">책임·발생 신호·예방조치</text><text x="286.0" y="594" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">일정·예산 반영 여부 검토</text><rect x="98.0" y="758" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="114.0" y="789" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">실행 후 재평가</text><text x="114.0" y="824" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">실행 증거로 잔여 위험 확인</text><text x="114.0" y="849" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">최초 평가도 함께 보존</text><rect x="442.0" y="758" width="300" height="119" rx="4" fill="#eaf4ef" stroke="#3f705e" stroke-width="1.5"/><text x="458.0" y="789" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">발생한 사건은 이슈</text><text x="458.0" y="824" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">발생 사실·영향·조치</text><text x="458.0" y="849" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">D03에서 담당·기한 추적</text><rect x="192.575" y="194.0" width="110.85" height="21" fill="#fffefb"/><text x="248.0" y="210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">무엇부터 볼까</text><rect x="529.075" y="194.0" width="125.85" height="21" fill="#fffefb"/><text x="592.0" y="210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">노출은 얼마일까</text><rect x="212.0" y="430.0" width="72" height="21" fill="#fffefb"/><text x="248.0" y="446.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">우선순위</text><rect x="544.075" y="430.0" width="95.85" height="21" fill="#fffefb"/><text x="592.0" y="446.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">예비비 근거</text><rect x="176.22500000000002" y="663.0" width="143.54999999999998" height="21" fill="#fffefb"/><text x="248.0" y="679.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">실행 증거 수신 후</text><rect x="357.075" y="723" width="125.85" height="21" fill="#fffefb"/><text x="420.0" y="739" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">발생이 확인되면</text></svg>