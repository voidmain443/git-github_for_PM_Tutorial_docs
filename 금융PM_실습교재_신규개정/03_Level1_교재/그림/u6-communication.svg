<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 710" role="img" aria-labelledby="u6-communication-title u6-communication-desc" lang="ko"><title id="u6-communication-title">받는 사람이 다르면 정보도 다릅니다</title><desc id="u6-communication-desc">PM · 전달할 사실 정리：사실·업무 영향·확인 요청、D23 수신자별 작성。 스폰서에게：결정할 사항과 영향、주간보고에서 검토。 작업팀에게：수행할 일·담당·기한、작업회의에서 장애물 확인。 가맹점에게：업무 영향·확인 요청、내부 인건비 공유 제외。 수신과 질문 확인：발송·회신·미확인을 구분、후속 담당과 확인 방법。 참여 계획 · D31：현재·목표 상태의 차이、시연·협의·회신 활동 설계。PM · 전달할 사실 정리 → 스폰서에게：의사결정에 필요한 정보。 PM · 전달할 사실 정리 → 작업팀에게：실행에 필요한 정보。 PM · 전달할 사실 정리 → 가맹점에게：이용에 필요한 정보。 스폰서에게 → 수신과 질문 확인：검토·회신。 작업팀에게 → 수신과 질문 확인：질문·확인。 가맹점에게 → 수신과 질문 확인：이해·피드백。 수신과 질문 확인 → 참여 계획 · D31：필요한 다음 행동。</desc><defs><marker id="u6-communication-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="420.0,175 420.0,221.0 161.33333333333331,221.0 161.33333333333331,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u6-communication-arrow)"/><polyline points="420.0,175 420.0,221.0 419.99999999999994,221.0 419.99999999999994,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u6-communication-arrow)"/><polyline points="420.0,175 420.0,221.0 678.6666666666666,221.0 678.6666666666666,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u6-communication-arrow)"/><polyline points="161.33333333333331,411 161.33333333333331,479.0 248.0,479.0 248.0,547" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u6-communication-arrow)"/><polyline points="419.99999999999994,411 419.99999999999994,479.0 248.0,479.0 248.0,547" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u6-communication-arrow)"/><polyline points="678.6666666666666,411 678.6666666666666,479.0 248.0,479.0 248.0,547" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u6-communication-arrow)"/><polyline points="398.0,606.5 442.0,606.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u6-communication-arrow)"/><rect x="270.0" y="56" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="286.0" y="87" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">PM · 전달할 사실 정리</text><text x="286.0" y="122" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">사실·업무 영향·확인 요청</text><text x="286.0" y="147" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">D23 수신자별 작성</text><rect x="54.0" y="267" width="214.66666666666666" height="144" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="70.0" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">스폰서에게</text><text x="70.0" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">결정할 사항과 영향</text><text x="70.0" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">주간보고에서 검토</text><rect x="312.66666666666663" y="267" width="214.66666666666666" height="144" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="328.66666666666663" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">작업팀에게</text><text x="328.66666666666663" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">수행할 일·담당·기한</text><text x="328.66666666666663" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">작업회의에서 장애물</text><text x="328.66666666666663" y="383" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">확인</text><rect x="571.3333333333333" y="267" width="214.66666666666666" height="144" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="587.3333333333333" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">가맹점에게</text><text x="587.3333333333333" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">업무 영향·확인 요청</text><text x="587.3333333333333" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">내부 인건비 공유</text><text x="587.3333333333333" y="383" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">제외</text><rect x="98.0" y="547" width="300" height="119" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="114.0" y="578" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">수신과 질문 확인</text><text x="114.0" y="613" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">발송·회신·미확인을 구분</text><text x="114.0" y="638" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">후속 담당과 확인 방법</text><rect x="442.0" y="547" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="458.0" y="578" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">참여 계획 · D31</text><text x="458.0" y="613" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">현재·목표 상태의 차이</text><text x="458.0" y="638" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">시연·협의·회신 활동 설계</text><rect x="71.48333333333332" y="194.0" width="179.7" height="21" fill="#fffefb"/><text x="161.33333333333331" y="210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">의사결정에 필요한 정보</text><rect x="345.15" y="194.0" width="149.7" height="21" fill="#fffefb"/><text x="419.99999999999994" y="210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">실행에 필요한 정보</text><rect x="603.8166666666666" y="194.0" width="149.7" height="21" fill="#fffefb"/><text x="678.6666666666666" y="210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">이용에 필요한 정보</text><rect x="120.90833333333332" y="452.0" width="80.85" height="21" fill="#fffefb"/><text x="161.33333333333331" y="468.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">검토·회신</text><rect x="379.57499999999993" y="452.0" width="80.85" height="21" fill="#fffefb"/><text x="419.99999999999994" y="468.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">질문·확인</text><rect x="630.7416666666667" y="452.0" width="95.85" height="21" fill="#fffefb"/><text x="678.6666666666666" y="468.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">이해·피드백</text><rect x="352.65" y="512" width="134.7" height="21" fill="#fffefb"/><text x="420.0" y="528" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size=