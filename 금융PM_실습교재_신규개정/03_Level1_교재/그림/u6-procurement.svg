<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 773" role="img" aria-labelledby="u6-procurement-title u6-procurement-desc" lang="ko"><title id="u6-procurement-title">선정 권고가 계약이 되기까지</title><desc id="u6-procurement-desc">같은 범위부터 확인：R02·R03와 인도물 대조、D27 SOW·검수 조건。 사전 기준으로 평가：기술·납기·가격 가중치、두 제안에 동일하게 적용。 선정 권고 · D28：점수와 조건 검토의 이유、권고와 체결 상태를 구분。 강태훈 · 계약 작성：범위·검수·보증·지급 조건、현재는 계약 초안。 최민석 · 계약 검토：재무·지급 조건 대조、검토 의견과 수정 기록。 윤서진 · 서명 절차：권한자의 서명 근거 확인、S1에서는 서명 전。같은 범위부터 확인 → 사전 기준으로 평가：비교 대상 고정。 사전 기준으로 평가 → 선정 권고 · D28：산식·조건 해석。 선정 권고 · D28 → 강태훈 · 계약 작성：권고안 상정。 강태훈 · 계약 작성 → 최민석 · 계약 검토：조건 검토。 최민석 · 계약 검토 → 윤서진 · 서명 절차：보완 후 서명 요청。</desc><defs><marker id="u6-procurement-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="398.0,159.5 442.0,159.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u6-procurement-arrow)"/><polyline points="592.0,219 592.0,287.0 248.0,287.0 248.0,355" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u6-procurement-arrow)"/><polyline points="398.0,414.5 442.0,414.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u6-procurement-arrow)"/><polyline points="592.0,474 592.0,542.0 248.0,542.0 248.0,610" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u6-procurement-arrow)"/><polyline points="398.0,669.5 442.0,669.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u6-procurement-arrow)"/><rect x="98.0" y="100" width="300" height="119" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="114.0" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">같은 범위부터 확인</text><text x="114.0" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">R02·R03와 인도물 대조</text><text x="114.0" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">D27 SOW·검수 조건</text><rect x="442.0" y="100" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="458.0" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">사전 기준으로 평가</text><text x="458.0" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">기술·납기·가격 가중치</text><text x="458.0" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">두 제안에 동일하게 적용</text><rect x="98.0" y="355" width="300" height="119" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="114.0" y="386" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">선정 권고 · D28</text><text x="114.0" y="421" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">점수와 조건 검토의 이유</text><text x="114.0" y="446" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">권고와 체결 상태를 구분</text><rect x="442.0" y="355" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="458.0" y="386" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">강태훈 · 계약 작성</text><text x="458.0" y="421" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">범위·검수·보증·지급 조건</text><text x="458.0" y="446" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">현재는 계약 초안</text><rect x="98.0" y="610" width="300" height="119" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="114.0" y="641" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">최민석 · 계약 검토</text><text x="114.0" y="676" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">재무·지급 조건 대조</text><text x="114.0" y="701" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">검토 의견과 수정 기록</text><rect x="442.0" y="610" width="300" height="119" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="458.0" y="641" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">윤서진 · 서명 절차</text><text x="458.0" y="676" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">권한자의 서명 근거 확인</text><text x="458.0" y="701" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">S1에서는 서명 전</text><rect x="360.15" y="65" width="119.69999999999999" height="21" fill="#fffefb"/><text x="420.0" y="81" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">비교 대상 고정</text><rect x="188.15" y="260.0" width="119.69999999999999" height="21" fill="#fffefb"/><text x="248.0" y="276.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">산식·조건 해석</text><rect x="372.075" y="320" width="95.85" height="21" fill="#fffefb"/><text x="420.0" y="336" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">권고안 상정</text><rect x="207.575" y="515.0" width="80.85" height="21" fill="#fffefb"/><text x="248.0" y="531.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">조건 검토</text><rect x="348.225" y="575" width="143.54999999999998" height="21" fill="#fffefb"/><text x="420.0" y="591" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">보완 후 서명 요청</text></svg>