<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 810" role="img" aria-labelledby="u9-benefit-handoff-title u9-benefit-handoff-desc" lang="ko"><title id="u9-benefit-handoff-title">프로젝트가 끝나도 이어지는 책임</title><desc id="u9-benefit-handoff-desc">AP03 · 프로젝트 종료：수행과 잔여 책임 인계 확인、운영 책임은 계속 남음。 운영·지원 이어가기：OM01·RB01·QA-01 인계、운영 박다은 · 기술 이현우。 무상 보완 창구 유지：1월 23일~2월 21일、강태훈 접수 창구、지급채무 정리와 별개。 편익 측정 예정：2월 1일~26일 · 20영업일、박다은이 운영일지 취합、미래 결과는 아직 없음。 측정 항목 구분：팀의 일별 순대사 경과시간、운영자별 투입시간은 별도、예외 이력 누락도 기록。 운영 결과로 목표 판단：2월 26일 윤서진에게 보고、측정 자료로 달성 여부 확인。AP03 · 프로젝트 종료 → 운영·지원 이어가기：운영 책임 인계。 AP03 · 프로젝트 종료 → 무상 보완 창구 유지：계속되는 보증。 AP03 · 프로젝트 종료 → 편익 측정 예정：편익 추적 인계。 운영·지원 이어가기 → 측정 항목 구분：일별 운영 자료。 편익 측정 예정 → 측정 항목 구분：같은 측정 기준。 측정 항목 구분 → 운영 결과로 목표 판단：기간 자료를 모아 판단。</desc><defs><marker id="u9-benefit-handoff-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="420.0,175 420.0,221.0 161.33333333333331,221.0 161.33333333333331,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u9-benefit-handoff-arrow)"/><polyline points="420.0,175 420.0,221.0 419.99999999999994,221.0 419.99999999999994,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u9-benefit-handoff-arrow)"/><polyline points="420.0,175 420.0,221.0 678.6666666666666,221.0 678.6666666666666,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u9-benefit-handoff-arrow)"/><polyline points="161.33333333333331,486 161.33333333333331,554.0 248.0,554.0 248.0,622" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u9-benefit-handoff-arrow)"/><polyline points="678.6666666666666,486 678.6666666666666,554.0 248.0,554.0 248.0,622" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u9-benefit-handoff-arrow)"/><polyline points="398.0,694.0 442.0,694.0" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u9-benefit-handoff-arrow)"/><rect x="270.0" y="56" width="300" height="119" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="286.0" y="87" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">AP03 · 프로젝트 종료</text><text x="286.0" y="122" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">수행과 잔여 책임 인계 확인</text><text x="286.0" y="147" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">운영 책임은 계속 남음</text><rect x="54.0" y="267" width="214.66666666666666" height="219" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="70.0" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">운영·지원</text><text x="70.0" y="325" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">이어가기</text><text x="70.0" y="360" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">OM01·RB01·QA-01</text><text x="70.0" y="385" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">인계</text><text x="70.0" y="410" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">운영 박다은 · 기술</text><text x="70.0" y="435" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">이현우</text><rect x="312.66666666666663" y="267" width="214.66666666666666" height="219" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="328.66666666666663" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">무상 보완 창구</text><text x="328.66666666666663" y="325" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">유지</text><text x="328.66666666666663" y="360" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">1월 23일~2월 21일</text><text x="328.66666666666663" y="385" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">강태훈 접수 창구</text><text x="328.66666666666663" y="410" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">지급채무 정리와 별개</text><rect x="571.3333333333333" y="267" width="214.66666666666666" height="219" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="587.3333333333333" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">편익 측정 예정</text><text x="587.3333333333333" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">2월 1일~26일 ·</text><text x="587.3333333333333" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">20영업일</text><text x="587.3333333333333" y="383" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">박다은이 운영일지</text><text x="587.3333333333333" y="408" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">취합</text><text x="587.3333333333333" y="433" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">미래 결과는 아직</text><text x="587.3333333333333" y="458" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">없음</text><rect x="98.0" y="622" width="300" height="144" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="114.0" y="653" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">측정 항목 구분</text><text x="114.0" y="688" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">팀의 일별 순대사 경과시간</text><text x="114.0" y="713" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">운영자별 투입시간은 별도</text><text x="114.0" y="738" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">예외 이력 누락도 기록</text><rect x="442.0" y="622" width="300" height="144" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="458.0" y="653" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">운영 결과로 목표 판단</text><text x="458.0" y="688" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">2월 26일 윤서진에게 보고</text><text x="458.0" y="713" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">측정 자료로 달성 여부 확인</text><rect x="101.48333333333332" y="194.0" width="119.69999999999999" height="21" fill="#fffefb"/><text x="161.33333333333331" y="210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">운영 책임 인계</text><rect x="364.57499999999993" y="194.0" width="110.85" height="21" fill="#fffefb"/><text x="419.99999999999994" y="210.0" font-family="NanumGothic, A