 y="383" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">배정·정보 요청·변경</text><text x="587.3333333333333" y="408" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">상정</text><text x="587.3333333333333" y="433" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">기준선 단독 변경</text><text x="587.3333333333333" y="458" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">불가</text><rect x="93.98333333333332" y="244.0" width="134.7" height="21" fill="#fffefb"/><text x="161.33333333333331" y="260.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">업무 문제를 연결</text><rect x="352.65" y="244.0" width="134.7" height="21" fill="#fffefb"/><text x="419.99999999999994" y="260.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">측정 조건을 연결</text><rect x="611.3166666666666" y="244.0" width="134.7" height="21" fill="#fffefb"/><text x="678.6666666666666" y="260.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">권한 경로를 연결</text></svg>