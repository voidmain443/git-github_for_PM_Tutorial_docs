<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 530" role="img" aria-labelledby="u1-evidence-map-title u1-evidence-map-desc" lang="ko"><title id="u1-evidence-map-title">원천의 사실을 헌장의 판단 항목으로 옮깁니다</title><desc id="u1-evidence-map-desc">S01·S05：사업 요청과 현재 업무、문제와 개선 이유를 읽음。 S01·S17：현재값·목표값·측정 조건、대상·기간·책임을 읽음。 S02：회사 권한·문서 규정、수행과 승인 역할을 읽음。 D01 사업 필요：현재 문제 → 업무 영향、왜 시작하는지 설명。 D01 목표와 측정：성공을 판단할 조건、미래 달성 결과와 구분。 D01 PM 권한：배정·정보 요청·변경 상정、기준선 단독 변경 불가。S01·S05 → D01 사업 필요：업무 문제를 연결。 S01·S17 → D01 목표와 측정：측정 조건을 연결。 S02 → D01 PM 권한：권한 경로를 연결。</desc><defs><marker id="u1-evidence-map-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="161.33333333333331,225 161.33333333333331,317" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u1-evidence-map-arrow)"/><polyline points="419.99999999999994,225 419.99999999999994,317" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u1-evidence-map-arrow)"/><polyline points="678.6666666666666,225 678.6666666666666,317" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u1-evidence-map-arrow)"/><rect x="54.0" y="56" width="214.66666666666666" height="169" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="70.0" y="87" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">S01·S05</text><text x="70.0" y="122" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">사업 요청과 현재</text><text x="70.0" y="147" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">업무</text><text x="70.0" y="172" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">문제와 개선 이유를</text><text x="70.0" y="197" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">읽음</text><rect x="312.66666666666663" y="56" width="214.66666666666666" height="169" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="328.66666666666663" y="87" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">S01·S17</text><text x="328.66666666666663" y="122" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">현재값·목표값·측정</text><text x="328.66666666666663" y="147" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">조건</text><text x="328.66666666666663" y="172" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">대상·기간·책임을</text><text x="328.66666666666663" y="197" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">읽음</text><rect x="571.3333333333333" y="56" width="214.66666666666666" height="169" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="587.3333333333333" y="87" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">S02</text><text x="587.3333333333333" y="122" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">회사 권한·문서 규정</text><text x="587.3333333333333" y="147" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">수행과 승인 역할을</text><text x="587.3333333333333" y="172" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">읽음<