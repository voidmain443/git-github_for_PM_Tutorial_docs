ill="#53627a">검증 증거</text><rect x="532.15" y="238.0" width="119.69999999999999" height="21" fill="#fffefb"/><text x="592.0" y="254.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">보안 시험 증거</text><rect x="188.15" y="471.0" width="119.69999999999999" height="21" fill="#fffefb"/><text x="248.0" y="487.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">현업 수용 확인</text><rect x="532.15" y="471.0" width="119.69999999999999" height="21" fill="#fffefb"/><text x="592.0" y="487.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">보안 확인 연결</text><rect x="360.15" y="531" width="119.69999999999999" height="21" fill="#fffefb"/><text x="420.0" y="547" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">종료 조건 상정</text></svg>