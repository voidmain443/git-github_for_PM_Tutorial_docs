<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 729" role="img" aria-labelledby="u9-acceptance-close-title u9-acceptance-close-desc" lang="ko"><title id="u9-acceptance-close-title">검증·인수·종료의 책임을 나누기</title><desc id="u9-acceptance-close-desc">승인 요구 · D09：약속한 인도물과 인수조건、변경된 요구도 포함。 정유나 · QA 검증：시험·보완·재시험 증거、조건 충족 여부 확인。 박다은 · AT01 인수：현업이 결과를 받아들임、D12에 인수 근거 연결。 오수빈 · SC01 확인：권한·로그 등 보안 확인、현업 인수와 범위 구분。 운영·계약·자원 인계：매뉴얼·복구·지원 창구、잔액·보증·잔여 책임 확인。 윤서진 · AP03 종료：인수와 잔여 책임 인계 확인、종료 승인본 보존。승인 요구 · D09 → 정유나 · QA 검증：시험 판단 기준。 정유나 · QA 검증 → 박다은 · AT01 인수：검증 증거。 정유나 · QA 검증 → 오수빈 · SC01 확인：보안 시험 증거。 박다은 · AT01 인수 → 운영·계약·자원 인계：현업 수용 확인。 오수빈 · SC01 확인 → 운영·계약·자원 인계：보안 확인 연결。 운영·계약·자원 인계 → 윤서진 · AP03 종료：종료 조건 상정。</desc><defs><marker id="u9-acceptance-close-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="398.0,159.5 442.0,159.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u9-acceptance-close-arrow)"/><polyline points="592.0,219 592.0,265.0 248.0,265.0 248.0,311" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u9-acceptance-close-arrow)"/><polyline points="592.0,219 592.0,265.0 592.0,265.0 592.0,311" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u9-acceptance-close-arrow)"/><polyline points="248.0,430 248.0,498.0 248.0,498.0 248.0,566" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u9-acceptance-close-arrow)"/><polyline points="592.0,430 592.0,498.0 248.0,498.0 248.0,566" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u9-acceptance-close-arrow)"/><polyline points="398.0,625.5 442.0,625.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u9-acceptance-close-arrow)"/><rect x="98.0" y="100" width="300" height="119" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="114.0" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">승인 요구 · D09</text><text x="114.0" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">약속한 인도물과 인수조건</text><text x="114.0" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">변경된 요구도 포함</text><rect x="442.0" y="100" width="300" height="119" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="458.0" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">정유나 · QA 검증</text><text x="458.0" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">시험·보완·재시험 증거</text><text x="458.0" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">조건 충족 여부 확인</text><rect x="98.0" y="311" width="300" height="119" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="114.0" y="342" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">박다은 · AT01 인수</text><text x="114.0" y="377" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">현업이 결과를 받아들임</text><text x="114.0" y="402" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">D12에 인수 근거 연결</text><rect x="442.0" y="311" width="300" height="119" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="458.0" y="342" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">오수빈 · SC01 확인</text><text x="458.0" y="377" font-family="NanumGothic, Apple SD 