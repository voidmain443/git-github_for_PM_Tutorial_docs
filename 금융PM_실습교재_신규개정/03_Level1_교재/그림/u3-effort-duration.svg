<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 666" role="img" aria-labelledby="u3-effort-duration-title u3-effort-duration-desc" lang="ko"><title id="u3-effort-duration-title">공수·인원·기간을 다른 입력으로 읽습니다</title><desc id="u3-effort-duration-desc">C 조회개발：아래 세 조건을 함께 읽음、현재는 계획 추정。 공수 50인일：사람의 총 투입량、개인별 투입을 합한 단위。 가용 인원 4명：배정 가능한 개발 인원、개인 하루 한도 1인일。 기간 15영업일：활동이 흐르는 작업 시간、월~금 교육 달력 적용。 배치 가능성 검토：50÷4=12.5는 단순 환산、15일 추정의 조건도 확인。C 조회개발 → 공수 50인일：얼마나 일할까。 C 조회개발 → 가용 인원 4명：누가 가능할까。 C 조회개발 → 기간 15영업일：얼마 동안 할까。 공수 50인일 → 배치 가능성 검토：총량。 가용 인원 4명 → 배치 가능성 검토：가용 조건。 기간 15영업일 → 배치 가능성 검토：기간 조건。</desc><defs><marker id="u3-effort-duration-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="420.0,175 420.0,221.0 161.33333333333331,221.0 161.33333333333331,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u3-effort-duration-arrow)"/><polyline points="420.0,175 420.0,221.0 419.99999999999994,221.0 419.99999999999994,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u3-effort-duration-arrow)"/><polyline points="420.0,175 420.0,221.0 678.6666666666666,221.0 678.6666666666666,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u3-effort-duration-arrow)"/><polyline points="161.33333333333331,411 161.33333333333331,457.0 420.0,457.0 420.0,503" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u3-effort-duration-arrow)"/><polyline points="419.99999999999994,411 419.99999999999994,457.0 420.0,457.0 420.0,503" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u3-effort-duration-arrow)"/><polyline points="678.6666666666666,411 678.6666666666666,457.0 420.0,457.0 420.0,503" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u3-effort-duration-arrow)"/><rect x="270.0" y="56" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="286.0" y="87" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">C 조회개발</text><text x="286.0" y="122" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">아래 세 조건을 함께 읽음</text><text x="286.0" y="147" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">현재는 계획 추정</text><rect x="54.0" y="267" width="214.66666666666666" height="144" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="70.0" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">공수 50인일</text><text x="70.0" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">사람의 총 투입량</text><text x="70.0" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">개인별 투입을 합한</text><text x="70.0" y="383" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">단위</text><rect x="312.66666666666663" y="267" width="214.66666666666666" height="144" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="328.66666666666663" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">가용 인원 4명</text><text x="328.66666666666663" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">배정 가능한 개발</text><text x="328.66666666666663" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">인원</text><text x="328.66666666666663" y="383" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">개인 하루 한도 1인일</text><rect x="571.3333333333333" y="267" width="214.66666666666666" height="144" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="587.3333333333333" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">기간 15영업일</text><text x="587.3333333333333" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">활동이 흐르는 작업</text><text x="587.3333333333333" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">시간</text><text x="587.3333333333333" y="383" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">월~금 교육 달력 적용</text><rect x="270.0" y="503" width="300" height="119" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="286.0" y="534" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">배치 가능성 검토</text><text x="286.0" y="569" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">50÷4=12.5는 단순 환산</text><text x="286.0" y="594" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">15일 추정의 조건도 확인</text><rect x="105.90833333333332" y="194.0" width="110.85" height="21" fill="#fffefb"/><text x="161.33333333333331" y="210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">얼마나 일할까</text><rect x="364.57499999999993" y="194.0" width="110.85" height="21" fill="#fffefb"/><text x="419.99999999999994" y="210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">누가 가능할까</text><rect x="618.8166666666666" y="194.0" width="119.69999999999999" height="21" fill="#fffefb"/><text x="678.6666666666666" y="210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">얼마 동안 할까</text><rect x="140.33333333333331" y="430.0" width="42" height="21" fill="#fffefb"/><text x="161.33333333333331" y="446.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">총량</text><rect x="379.57499999999993" y="430.0" width="80.85" height="21" fill="#fffefb"/><text x="419.99999999999994" y="446.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">가용 조건</text><rect x="638.2416666666667" y="430.0" width="80.85" height="21" fill="#fffefb"/><text x="678.6666666666666" y="446.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">기간 조건</text></svg>