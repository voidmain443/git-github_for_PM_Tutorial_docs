<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 641" role="img" aria-labelledby="u5-quality-title u5-quality-desc" lang="ko"><title id="u5-quality-title">절차 점검과 제품 검사는 다릅니다</title><desc id="u5-quality-desc">품질계획 · D18：무엇을 합격으로 볼까?、기준·방법·담당·증거。 절차 점검 · D19：요구–설계–시험 연결 확인、좋은 결과를 만드는 과정 점검。 제품 검사 · D20：기대결과와 실제결과 대조、정유나가 시험 증거 확인。 현업 인수 · D12：박다은이 수용 여부 판단、검증과 인수 권한을 구분。품질계획 · D18 → 절차 점검 · D19：만드는 과정。 품질계획 · D18 → 제품 검사 · D20：완성한 결과。 제품 검사 · D20 → 현업 인수 · D12：검증 증거 인계。</desc><defs><marker id="u5-quality-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="420.0,175 420.0,221.0 248.0,221.0 248.0,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u5-quality-arrow)"/><polyline points="420.0,175 420.0,221.0 592.0,221.0 592.0,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u5-quality-arrow)"/><polyline points="592.0,386 592.0,432.0 420.0,432.0 420.0,478" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u5-quality-arrow)"/><rect x="270.0" y="56" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="286.0" y="87" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">품질계획 · D18</text><text x="286.0" y="122" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">무엇을 합격으로 볼까?</text><text x="286.0" y="147" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">기준·방법·담당·증거</text><rect x="98.0" y="267" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="114.0" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">절차 점검 · D19</text><text x="114.0