<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 557" role="img" aria-labelledby="u0-money-title u0-money-desc" lang="ko"><title id="u0-money-title">같은 원화라도 답하는 질문이 다릅니다</title><desc id="u0-money-desc">어떤 돈을 읽는가：같은 원 단위여도 의미는 다름、주인·시점·목적부터 확인。 가맹점 지급예정액：가맹점에 지급할 예정액、운영의 정산 업무에서 확인、회사 매출과 구분。 회사 현금：특정 시점의 회사 전체 잔액、재무 자료에서 확인、프로젝트 배정액과 구분。 프로젝트 자금 한도：이번 사업의 투자 경계、스폰서의 조건으로 확인、상세 기준선은 별도 승인。어떤 돈을 읽는가 → 가맹점 지급예정액：얼마를 지급할까。 어떤 돈을 읽는가 → 회사 현금：얼마를 보유했나。 어떤 돈을 읽는가 → 프로젝트 자금 한도：어디까지 계획할까。</desc><defs><marker id="u0-money-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="420.0,175 420.0,221.0 161.33333333333331,221.0 161.33333333333331,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u0-money-arrow)"/><polyline points="420.0,175 420.0,221.0 419.99999999999994,221.0 419.99999999999994,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u0-money-arrow)"/><polyline points="420.0,175 420.0,221.0 678.6666666666666,221.0 678.6666666666666,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u0-money-arrow)"/><rect x="270.0" y="56" width="300" height="119" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="286.0" y="87" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">어떤 돈을 읽는가</text><text x="286.0" y="122" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">같은 원 단위여도 의미는 다름</text><text x="286.0" y="147" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">주인·시점·목적부터 확인</text><rect x="54.0" y="267" width="214.66666666666666" height="246" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="70.0" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">가맹점 지급예정액</text><text x="70.0" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">가맹점에 지급할</text><text x="70.0" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">예정액</text><text x="70.0" y="383" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">운영의 정산 업무에서</text><text x="70.0" y="408" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a"> 확인</text><text x="70.0" y="433" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">회사 매출과 구분</text><rect x="312.66666666666663" y="267" width="214.66666666666666" height="246" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="328.66666666666663" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">회사 현금</text><text x="328.66666666666663" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">특정 시점의 회사</text><text x="328.66666666666663" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">전체 잔액</text><text x="328.66666666666663" y="383" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">재무 자료에서 확인</text><text x="328.66666666666663" y="408" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">프로젝트 배정액과</text><text x="328.66666666666663" y="433" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">구분</text><rect x="571.3333333333333" y="267" width="214.66666666666666" height="246" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="587.3333333333333" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">프로젝트 자금</text><text x="587.3333333333333" y="325" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">한도</text><text x="587.3333333333333" y="360" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">이번 사업의 투자</text><text x="587.3333333333333" y="385" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">경계</text><text x="587.3333333333333" y="410" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">스폰서의 조건으로</text><text x="587.3333333333333" y="435" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">확인</text><text x="587.3333333333333" y="460" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">상세 기준선은 별도</text><text x="587.3333333333333" y="485" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">승인</text><rect x="98.40833333333332" y="194.0" width="125.85" height="21" fill="#fffefb"/><text x="161.33333333333331" y="210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">얼마를 지급할까</text><rect x="357.07499999999993" y="194.0" width="125.85" height="21" fill="#fffefb"/><text x="419.99999999999994" y="210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">얼마를 보유했나</text><rect x="608.2416666666667" y="194.0" width="140.85" height="21" fill="#fffefb"/><text x="678.6666666666666" y="210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">어디까지 계획할까</text></svg>