<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 641" role="img" aria-labelledby="u4-budget-structure-title u4-budget-structure-desc" lang="ko"><title id="u4-budget-structure-title">원가기준선과 총자금의 경계를 나눕니다</title><desc id="u4-budget-structure-desc">작업원가：정의된 활동의 추정 비용、수량·단가·고정가 근거。 우발예비비：식별한 위험의 대응 비용、원가기준선 안에 포함。 원가기준선 후보：작업원가 + 우발예비비、통합 검토 후 승인 대상。 관리예비비：원가기준선 밖에 둠、별도 승인·전용 규칙 적용。 총자금 요구：기준선 후보 + 관리예비비、전체 자금 필요를 설명。작업원가 → 원가기준선 후보：합산。 우발예비비 → 원가기준선 후보：합산。 원가기준선 후보 → 총자금 요구：합산。 관리예비비 → 총자금 요구：별도 항목으로 합산。</desc><defs><marker id="u4-budget-structure-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="248.0,175 248.0,221.0 248.0,221.0 248.0,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u4-budget-structure-arrow)"/><polyline points="592.0,175 592.0,221.0 248.0,221.0 248.0,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u4-budget-structure-arrow)"/><polyline points="248.0,386 248.0,432.0 420.0,432.0 420.0,478" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u4-budget-structure-arrow)"/><polyline points="592.0,386 592.0,432.0 420.0,432.0 420.0,478" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u4-budget-structure-arrow)"/><rect x="98.0" y="56" width="300" height="119" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="114.0" y="87" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">작업원가</text><text x="114.0" y="122" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">정의된 활동의 추정 비용</text><text x="114.0" y="147" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">수량·단가·고정가 근거</text><rect x="442.0" y="56" width="300" height="119" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="458.0" y="87" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">우발예비비</text><text x="458.0" y="122" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">식별한 위험의 대응 비용</text><text x="458.0" y="147" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">원가기준선 안에 포함</text><rect x="98.0" y="267" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="114.0" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">원가기준선 후보</text><text x="114.0" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">작업원가 + 우발예비비</text><text x="114.0" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">통합 검토 후 승인 대상</text><rect x="442.0" y="267" width="300" height="119" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="458.0" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">관리예비비</text><text x="458.0" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">원가기준선 밖에 둠</text><text x="458.0" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">별도 승인·전용 규칙 적용</text><rect x="270.0" y="478" width="300" height="119" rx="4" fill="#eaf4ef" stroke="#3f705e" stroke-width="1.5"/><text x="286.0" y="509" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">총자금 요구</text><text x="286.0" y="544" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">기준선 후보 + 관리예비비</text><text x="286.0" y="569" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">전체 자금 필요를 설명</text><rect x="227.0" y="194.0" width="42" height="21" fill="#fffefb"/><text x="248.0" y="210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">합산</text><rect x="571.0" y="194.0" width="42" height="21" fill="#fffefb"/><text x="592.0" y="210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">합산</text><rect x="227.0" y="405.0" width="42" height="21" fill="#fffefb"/><text x="248.0" y="421.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">합산</text><rect x="517.15" y="405.0" width="149.7" height="21" fill="#fffefb"/><text x="592.0" y="421.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">별도 항목으로 합산</text></svg>