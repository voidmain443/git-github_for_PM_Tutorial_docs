<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 854" role="img" aria-labelledby="u2-wbs-scope-title u2-wbs-scope-desc" lang="ko"><title id="u2-wbs-scope-title">WBS는 결과를 나누고, 활동은 그 결과를 만듭니다</title><desc id="u2-wbs-scope-desc">MP-01 개선 결과：이번에 인도할 범위를 분해、다음 가지는 계획의 구조。 1.1 요구·설계：명세·규격·권한 설계、계획 담당: 이현우。 1.2 조회：R01 조회·R04 권한·로그、계획 담당: 이현우。 1.3 대사·예외：R02/R03·소스·시험 증거、계획 담당: 공급사 역할。 1.4 검증：통합·보안 회귀시험 증거、계획 담당: 정유나。 1.5 전환·교육：매뉴얼·복구 절차·교육、계획 담당: 박다은。 1.6 안정화：운영 관찰·미결 사항 인계、계획 담당: 이현우。MP-01 개선 결과 → 1.1 요구·설계：결과를 분해。 MP-01 개선 결과 → 1.2 조회：결과를 분해。 MP-01 개선 결과 → 1.3 대사·예외：결과를 분해。 MP-01 개선 결과 → 1.4 검증：결과를 분해。 MP-01 개선 결과 → 1.5 전환·교육：결과를 분해。 MP-01 개선 결과 → 1.6 안정화：결과를 분해。</desc><defs><marker id="u2-wbs-scope-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="260,427.0 296,427.0 296,79.5 330,79.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u2-wbs-scope-arrow)"/><polyline points="260,427.0 296,427.0 296,218.5 330,218.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u2-wbs-scope-arrow)"/><polyline points="260,427.0 296,427.0 296,357.5 330,357.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u2-wbs-scope-arrow)"/><polyline points="260,427.0 296,427.0 296,496.5 330,496.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u2-wbs-scope-arrow)"/><polyline points="260,427.0 296,427.0 296,635.5 330,635.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u2-wbs-scope-arrow)"/><polyline points="260,427.0 296,427.0 296,774.5 330,774.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u2-wbs-scope-arrow)"/><rect x="330" y="20" width="470" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="346" y="51" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">1.1 요구·설계</text><text x="346" y="86" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">명세·규격·권한 설계</text><text x="346" y="111" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">계획 담당: 이현우</text><rect x="330" y="159" width="470" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="346" y="190" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">1.2 조회</text><text x="346" y="225" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">R01 조회·R04 권한·로그</text><text x="346" y="250" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">계획 담당: 이현우</text><rect x="330" y="298" width="470" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="346" y="329" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">1.3 대사·예외</text><text x="346" y="364" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">R02/R03·소스·시험 증거</text><text x="346" y="389" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">계획 담당: 공급사 역할</text><rect x="330" y="437" width="470" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="346" y="468" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">1.4 검증</text><text x="346" y="503" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">통합·보안 회귀시험 증거</text><text x="346" y="528" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">계획 담당: 정유나</text><rect x="330" y="576" width="470" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="346" y="607" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">1.5 전환·교육</text><text x="346" y="642" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">매뉴얼·복구 절차·교육</text><text x="346" y="667" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">계획 담당: 박다은</text><rect x="330" y="715" width="470" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="346" y="746" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">1.6 안정화</text><text x="346" y="781" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">운영 관찰·미결 사항 인계</text><text x="346" y="806" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">계획 담당: 이현우</text><rect x="20" y="355.0" width="240" height="144" rx="4" fill="#eaf4ef" stroke="#3f705e" stroke-width="1.5"/><text x="36" y="386.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">MP-01 개선 결과</text><text x="36" y="421.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">이번에 인도할 범위를</text><text x="36" y="446.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">분해</text><text x="36" y="471.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">다음 가지는 계획의 구조</text></svg>