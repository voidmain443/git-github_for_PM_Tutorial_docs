<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 773" role="img" aria-labelledby="u7-execution-title u7-execution-desc" lang="ko"><title id="u7-execution-title">승인된 계획을 실행 업무로 옮기기</title><desc id="u7-execution-desc">AP01 · 통합 승인：S09의 승인 조건 대조、BL01과 적용 버전 연결。 승인본 공지：PM이 문서 소유자에게 전달、같은 기준으로 일하도록 안내。 작업지시 · D03：학생 임시 작업 ID 부여、결정·담당·기한 연결。 수행할 업무：승인 범위 안에서 실행、무엇을 남겨야 완료일까?。 기다릴 실행 증거：실제 수행일·확인자·결과、원천 수신 전엔 확인 대기。 확인 후 상태 갱신：지시와 실제 결과 대조、후속 업무·보고에 반영。AP01 · 통합 승인 → 승인본 공지：적용할 기준。 승인본 공지 → 작업지시 · D03：회의 결정을 구체화。 작업지시 · D03 → 수행할 업무：책임·기한·완료조건。 수행할 업무 → 기다릴 실행 증거：수행 후 기록。 기다릴 실행 증거 → 확인 후 상태 갱신：근거를 확인한 뒤。</desc><defs><marker id="u7-execution-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="398.0,159.5 442.0,159.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u7-execution-arrow)"/><polyline points="592.0,219 592.0,287.0 248.0,287.0 248.0,355" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u7-execution-arrow)"/><polyline points="398.0,414.5 442.0,414.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u7-execution-arrow)"/><polyline points="592.0,474 592.0,542.0 248.0,542.0 248.0,610" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u7-execution-arrow)"/><polyline points="398.0,669.5 442.0,669.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u7-execution-arrow)"/><rect x="98.0" y="100" width="300" height="119" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="114.0" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">AP01 · 통합 승인</text><text x="114.0" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">S09의 승인 조건 대조</text><text x="114.0" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">BL01과 적용 버전 연결</text><rect x="442.0" y="100" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="458.0" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">승인본 공지</text><text x="458.0" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">PM이 문서 소유자에게 전달</text><text x="458.0" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">같은 기준으로 일하도록 안내</text><rect x="98.0" y="355" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="114.0" y="386" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">작업지시 · D03</text><text x="114.0" y="421" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">학생 임시 작업 ID 부여</text><text x="114.0" y="446" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">결정·담당·기한 연결</text><rect x="442.0" y="355" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="458.0" y="386" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">수행할 업무</text><text x="458.0" y="421" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">승인 범위 안에서 실행</text><text x="458.0" y="446" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">무엇을 남겨야 완료일까?</text><rect x="98.0" y="610" width="300" height="119" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="114.0" y="641" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">기다릴 실행 증거</text><text x="114.0" y="676" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">실제 수행일·확인자·결과</text><text x="114.0" y="701" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">원천 수신 전엔 확인 대기</text><rect x="442.0" y="610" width="300" height="119" rx="4" fill="#eaf4ef" stroke="#3f705e" stroke-width="1.5"/><text x="458.0" y="641" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">확인 후 상태 갱신</text><text x="458.0" y="676" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">지시와 실제 결과 대조</text><text x="458.0" y="701" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">후속 업무·보고에 반영</text><rect x="372.075" y="65" width="95.85" height="21" fill="#fffefb"/><text x="420.0" y="81" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">적용할 기준</text><rect x="173.15" y="260.0" width="149.7" height="21" fill="#fffefb"/><text x="248.0" y="276.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">회의 결정을 구체화</text><rect x="345.15" y="320" width="149.7" height="21" fill="#fffefb"/><text x="420.0" y="336" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">책임·기한·완료조건</text><rect x="195.65" y="515.0" width="104.69999999999999" height="21" fill="#fffefb"/><text x="248.0" y="531.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">수행 후 기록</text><rect x="352.65" y="575" width="134.7" height="21" fill="#fffefb"/><text x="420.0" y="591" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">근거를 확인한 뒤</text></svg>