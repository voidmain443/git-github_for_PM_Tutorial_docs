<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 570" role="img" aria-labelledby="u4-cost-payment-title u4-cost-payment-desc" lang="ko"><title id="u4-cost-payment-title">같은 용역의 약정·비용·지급을 따로 읽습니다</title><desc id="u4-cost-payment-desc">발주 계획：용역을 구매하는 약정、발주액은 실제 비용 아님。 부분검수·비용 계획：11월 외주 20백만원、용역 수행에 따른 비용。 청구 조건：검수 후 청구、지급할 채무와 조건 확인。 11월 지급 계획：외주 현금 12백만원、8백만원은 후속 지급 예정。 잔액 지급 계획：남은 8백만원은 1월、최종 인수 후 지급 조건。발주 계획 → 부분검수·비용 계획：인도·검수 계획。 부분검수·비용 계획 → 청구 조건：검수 후 청구。 청구 조건 → 11월 지급 계획：부분 지급 조건。 11월 지급 계획 → 잔액 지급 계획：잔액 지급 조건。</desc><defs><marker id="u4-cost-payment-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="268.66666666666663,185.5 312.66666666666663,185.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u4-cost-payment-arrow)"/><polyline points="527.3333333333333,185.5 571.3333333333333,185.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u4-cost-payment-arrow)"/><polyline points="678.6666666666666,271 678.6666666666666,339.0 248.0,339.0 248.0,407" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u4-cost-payment-arrow)"/><polyline points="398.0,466.5 442.0,466.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u4-cost-payment-arrow)"/><rect x="54.0" y="100" width="214.66666666666666" height="171" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="70.0" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">발주 계획</text><text x="70.0" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">용역을 구매하는 약정</text><text x="70.0" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">발주액은 실제 비용</text><text x="70.0" y="216" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">아님</text><rect x="312.66666666666663" y="100" width="214.66666666666666" height="171" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="328.66666666666663" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">부분검수·비용</text><text x="328.66666666666663" y="158" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">계획</text><text x="328.66666666666663" y="193" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">11월 외주 20백만원</text><text x="328.66666666666663" y="218" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">용역 수행에 따른</text><text x="328.66666666666663" y="243" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">비용</text><rect x="571.3333333333333" y="100" width="214.66666666666666" height="171" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="587.3333333333333" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">청구 조건</text><text x="587.3333333333333" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">검수 후 청구</text><text x="587.3333333333333" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">지급할 채무와 조건</text><text x="587.3333333333333" y="216" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">확인</text><rect x="98.0" y="407" width="300" height="119" rx="4" fill="#eaf4ef" stroke="#3f705e" stroke-width="1.5"/><text x="114.0" y="438" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">11월 지급 계획</text><text x="114.0" y="473" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">외주 현금 12백만원</text><text x="114.0" y="498" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">8백만원은 후속 지급 예정</text><rect x="442.0" y="407" width="300" height="119" rx="4" fill="#eaf4ef" stroke="#3f705e" stroke-width="1.5"/><text x="458.0" y="438" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">잔액 지급 계획</text><text x="458.0" y="473" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">남은 8백만원은 1월</text><text x="458.0" y="498" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">최종 인수 후 지급 조건</text><rect x="230.81666666666663" y="65" width="119.69999999999999" height="21" fill="#fffefb"/><text x="290.66666666666663" y="81" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">인도·검수 계획</text><rect x="496.98333333333323" y="65" width="104.69999999999999" height="21" fill="#fffefb"/><text x="549.3333333333333" y="81" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">검수 후 청구</text><rect x="188.15" y="312.0" width="119.69999999999999" height="21" fill="#fffefb"/><text x="248.0" y="328.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">부분 지급 조건</text><rect x="360.15" y="372" width="119.69999999999999" height="21" fill="#fffefb"/><text x="420.0" y="388" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">잔액 지급 조건</text></svg>