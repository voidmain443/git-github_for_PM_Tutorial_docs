<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 685" role="img" aria-labelledby="u2-r01-trace-title u2-r01-trace-desc" lang="ko"><title id="u2-r01-trace-title">한 요구가 구현과 시험에서 같은 뜻을 유지합니다</title><desc id="u2-r01-trace-desc">S03 운영의 요청：가맹점별 지급예정액 확인、요청자: 박다은。 D09의 R01：지정 날짜·가맹점 조회、원천 발언과 ID를 보존。 D11의 WBS 1.2：조회 패키지에서 구현、완료 증거를 정의。 R01의 인수조건：지급액이 원천 계산과 일치、같은 조건의 값을 비교。 T01 시험 계획：정산금액을 검사할 방법、현재는 기대결과를 정의。S03 운영의 요청 → D09의 R01：기능과 이유를 정리。 D09의 R01 → D11의 WBS 1.2：누가 무엇을 만들까。 D09의 R01 → R01의 인수조건：어떻게 수락할까。 D11의 WBS 1.2 → T01 시험 계획：검사할 인도물。 R01의 인수조건 → T01 시험 계획：기대결과의 기준。</desc><defs><marker id="u2-r01-trace-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="398.0,159.5 442.0,159.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u2-r01-trace-arrow)"/><polyline points="592.0,219 592.0,265.0 248.0,265.0 248.0,311" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u2-r01-trace-arrow)"/><polyline points="592.0,219 592.0,265.0 592.0,265.0 592.0,311" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u2-r01-trace-arrow)"/><polyline points="248.0,430 248.0,476.0 420.0,476.0 420.0,522" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u2-r01-trace-arrow)"/><polyline points="592.0,430 592.0,476.0 420.0,476.0 420.0,522" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u2-r01-trace-arrow)"/><rect x="98.0" y="100" width="300" height="119" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="114.0" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">S03 운영의 요청</text><text x="114.0" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">가맹점별 지급예정액 확인</text><text x="114.0" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">요청자: 박다은</text><rect x="442.0" y="100" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="458.0" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">D09의 R01</text><text x="458.0" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">지정 날짜·가맹점 조회</text><text x="458.0" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">원천 발언과 ID를 보존</text><rect x="98.0" y="311" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="114.0" y="342" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">D11의 WBS 1.2</text><text x="114.0" y="377" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">조회 패키지에서 구현</text><text x="114.0" y="402" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">완료 증거를 정의</text><rect x="442.0" y="311" width="300" height="119" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="458.0" y="342" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">R01의 인수조건</text><text x="458.0" y="377" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">지급액이 원천 계산과 일치</text><text x="458.0" y="402" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">같은 조건의 값을 비교</text><rect x="270.0" y="522" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="286.0" y="553" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">T01 시험 계획</text><text x="286.0" y="588" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">정산금액을 검사할 방법</text><text x="286.0" y="613" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">현재는 기대결과를 정의</text><rect x="345.15" y="65" width="149.7" height="21" fill="#fffefb"/><text x="420.0" y="81" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">기능과 이유를 정리</text><rect x="173.15" y="238.0" width="149.7" height="21" fill="#fffefb"/><text x="248.0" y="254.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">누가 무엇을 만들까</text><rect x="529.075" y="238.0" width="125.85" height="21" fill="#fffefb"/><text x="592.0" y="254.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">어떻게 수락할까</text><rect x="192.575" y="449.0" width="110.85" height="21" fill="#fffefb"/><text x="248.0" y="465.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">검사할 인도물</text><rect x="529.075" y="449.0" width="125.85" height="21" fill="#fffefb"/><text x="592.0" y="465.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">기대결과의 기준</text></svg>