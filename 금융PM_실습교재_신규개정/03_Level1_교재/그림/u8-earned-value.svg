<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 691" role="img" aria-labelledby="u8-earned-value-title u8-earned-value-desc" lang="ko"><title id="u8-earned-value-title">세 숫자가 서로 다른 질문에 답합니다</title><desc id="u8-earned-value-desc">비교 기준 맞추기：상태일 2026-11-30、같은 범위·단위: 백만원。 PV · 계획가치 60：이날까지 완료할 계획인、작업의 예산 가치。 EV · 획득가치 50：완료했다고 검증한、작업의 예산 가치。 AC · 실제원가 58：수행한 작업에 인식한 비용、현금 지급과 구분。 일정 가치 비교：SV = EV − PV、SPI = EV ÷ PV、지연일은 별도 일정 분석。 원가 성과 비교：CV = EV − AC、CPI = EV ÷ AC、완료 가치와 소비 비용 비교。비교 기준 맞추기 → PV · 계획가치 60：계획한 가치。 비교 기준 맞추기 → EV · 획득가치 50：검증한 가치。 비교 기준 맞추기 → AC · 실제원가 58：인식한 비용。 PV · 계획가치 60 → 일정 가치 비교：계획과 대조。 EV · 획득가치 50 → 일정 가치 비교：완료한 가치。 EV · 획득가치 50 → 원가 성과 비교：완료한 가치。 AC · 실제원가 58 → 원가 성과 비교：실제원가와 대조。</desc><defs><marker id="u8-earned-value-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="420.0,175 420.0,221.0 161.33333333333331,221.0 161.33333333333331,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u8-earned-value-arrow)"/><polyline points="420.0,175 420.0,221.0 419.99999999999994,221.0 419.99999999999994,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u8-earned-value-arrow)"/><polyline points="420.0,175 420.0,221.0 678.6666666666666,221.0 678.6666666666666,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u8-earned-value-arrow)"/><polyline points="161.33333333333331,411 248.0,503" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u8-earned-value-arrow)"/><polyline points="419.99999999999994,411 248.0,503" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u8-earned-value-arrow)"/><polyline points="419.99999999999994,411 592.0,503" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u8-earned-value-arrow)"/><polyline points="678.6666666666666,411 592.0,503" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u8-earned-value-arrow)"/><rect x="270.0" y="56" width="300" height="119" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="286.0" y="87" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">비교 기준 맞추기</text><text x="286.0" y="122" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">상태일 2026-11-30</text><text x="286.0" y="147" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">같은 범위·단위: 백만원</text><rect x="54.0" y="267" width="214.66666666666666" height="144" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="70.0" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">PV · 계획가치 60</text><text x="70.0" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">이날까지 완료할</text><text x="70.0" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">계획인</text><text x="70.0" y="383" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">작업의 예산 가치</text><rect x="312.66666666666663" y="267" width="214.66666666666666" height="144" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="328.66666666666663" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">EV · 획득가치 50</text><text x="328.66666666666663" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">완료했다고 검증한</text><text x="328.66666666666663" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">작업의 예산 가치</text><rect x="571.3333333333333" y="267" width="214.66666666666666" height="144" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="587.3333333333333" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">AC · 실제원가 58</text><text x="587.3333333333333" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">수행한 작업에 인식한</text><text x="587.3333333333333" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a"> 비용</text><text x="587.3333333333333" y="383" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">현금 지급과 구분</text><rect x="98.0" y="503" width="300" height="144" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="114.0" y="534" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">일정 가치 비교</text><text x="114.0" y="569" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">SV = EV − PV</text><text x="114.0" y="594" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">SPI = EV ÷ PV</text><text x="114.0" y="619" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">지연일은 별도 일정 분석</text><rect x="442.0" y="503" width="300" height="144" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="458.0" y="534" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">원가 성과 비교</text><text x="458.0" y="569" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">CV = EV − AC</text><text x="458.0" y="594" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">CPI = EV ÷ AC</text><text x="458.0" y="619" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">완료 가치와 소비 비용 비교</text><rect x="113.40833333333332" y="194.0" width="95.85" height="21" fill="#fffefb"/><text x="161.33333333333331" y="210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">계획한 가치</text><rect x="372.07499999999993" y="194.0" width="95.85" height="21" fill="#fffefb"/><text x="419.99999999999994" y="210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">검증한 가치</text><rect x="630.7416666666667" y="194.0" width="95.85" height="21" fill="#fffefb"/><text x="678.6666666666666" y="210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">인식한 비용</text><rect x="113.40833333333332" y="430.0" width="95.85" height="21" fill="#fffefb"/><text x="161.33333333333331" y="446.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">계획과 대조</text><rect x="372.07499999999993" y="430.0" width="95.85" height="21" fill="#fffefb"/><text x="419.99999999999994" y="446.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">완료한 가치</text><rect x="615.7416666666667" y="430.0" width="125.85" height="21" fill="#fffefb"/><text x="678.6666666666666" y="446.0" font-family="Nanum