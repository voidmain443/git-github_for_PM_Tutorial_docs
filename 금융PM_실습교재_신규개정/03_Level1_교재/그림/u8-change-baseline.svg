<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 856" role="img" aria-labelledby="u8-change-baseline-title u8-change-baseline-desc" lang="ko"><title id="u8-change-baseline-title">변경 승인 뒤 두 버전을 함께 관리하기</title><desc id="u8-change-baseline-desc">CR01 · 변경요청：새 요구와 이유를 접수、요청 자체는 승인 아님。 PM · 영향 분석：범위·일정·원가·자원 비교、대안과 권고를 D06에 기록。 관계자 영향 검토：최민석·이현우·박다은、조건과 감수할 영향을 확인。 윤서진 · AP02 승인：S12의 결정 범위를 대조、승인 근거·시점 연결。 BL01 · 이력 보존：원래 약속과 비교 근거、기존 버전을 삭제하지 않음。 BL02 · 새 기준 적용：승인된 범위에 맞춰 갱신、과거 실적은 소급 수정 안 함。 연결 문서 함께 갱신：요구·WBS·일정·예산、시험·작업·통지 기록。CR01 · 변경요청 → PM · 영향 분석：영향 확인。 PM · 영향 분석 → 관계자 영향 검토：대안·권고 상정。 관계자 영향 검토 → 윤서진 · AP02 승인：스폰서 결정。 윤서진 · AP02 승인 → BL01 · 이력 보존：이전 기준 보존。 윤서진 · AP02 승인 → BL02 · 새 기준 적용：승인 후 적용。 BL02 · 새 기준 적용 → 연결 문서 함께 갱신：같은 버전으로 업무。</desc><defs><marker id="u8-change-baseline-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="268.66666666666663,184.5 312.66666666666663,184.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u8-change-baseline-arrow)"/><polyline points="527.3333333333333,184.5 571.3333333333333,184.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u8-change-baseline-arrow)"/><polyline points="678.6666666666666,269 678.6666666666666,315.0 420.0,315.0 420.0,361" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u8-change-baseline-arrow)"/><polyline points="420.0,480 420.0,548.0 161.33333333333331,548.0 161.33333333333331,616" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u8-change-baseline-arrow)"/><polyline points="420.0,480 420.0,548.0 419.99999999999994,548.0 419.99999999999994,616" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u8-change-baseline-arrow)"/><polyline points="527.3333333333333,714.0 571.3333333333333,714.0" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u8-change-baseline-arrow)"/><rect x="54.0" y="100" width="214.66666666666666" height="169" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="70.0" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">CR01 · 변경요청</text><text x="70.0" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">새 요구와 이유를</text><text x="70.0" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">접수</text><text x="70.0" y="216" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">요청 자체는 승인</text><text x="70.0" y="241" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">아님</text><rect x="312.66666666666663" y="100" width="214.66666666666666" height="169" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="328.66666666666663" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">PM · 영향 분석</text><text x="328.66666666666663" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">범위·일정·원가·자원</text><text x="328.66666666666663" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">비교</text><text x="328.66666666666663" y="216" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">대안과 권고를 D06에</text><text x="328.66666666666663" y="241" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">기록</text><rect x="571.3333333333333" y="100" width="214.66666666666666" height="169" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="587.3333333333333" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">관계자 영향 검토</text><text x="587.3333333333333" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">최민석·이현우·박다은</text><text x="587.3333333333333" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">조건과 감수할 영향을</text><text x="587.3333333333333" y="216" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a"> 확인</text><rect x="270.0" y="361" width="300" height="119" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="286.0" y="392" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">윤서진 · AP02 승인</text><text x="286.0" y="427" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">S12의 결정 범위를 대조</text><text x="286.0" y="452" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">승인 근거·시점 연결</text><rect x="54.0" y="616" width="214.66666666666666" height="196" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="70.0" y="647" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">BL01 · 이력 보존</text><text x="70.0" y="682" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">원래 약속과 비교</text><text x="70.0" y="707" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">근거</text><text x="70.0" y="732" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">기존 버전을 삭제하지</text><text x="70.0" y="757" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a"> 않음</text><rect x="312.66666666666663" y="616" width="214.66666666666666" height="196" rx="4" fill="#eaf4ef" stroke="#3f705e" stroke-width="1.5"/><text x="328.66666666666663" y="647" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">BL02 · 새 기준</text><text x="328.66666666666663" y="674" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">적용</text><text x="328.66666666666663" y="709" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">승인된 범위에 맞춰</text><text x="328.66666666666663" y="734" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">갱신</text><text x="328.66666666666663" y="759" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">과거 실적은 소급</text><text x="328.66666666666663" y="784" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">수정 안 함</text><rect x="571.3333333333333" y="616" width="214.66666666666666" height="196" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="587.3333333333333" y="647" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">연결 문서 함께</text><text x="587.3333333333333" y="674" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">갱신</text><text x="587.3333333333333" y="709" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">요구·WBS·일정·예산</text><text x="587.3333333333333" y="734" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">시험·작업·통지 기록</text><rect x="250.24166666666662" y="65" width="80.85" height="21" fill="#fffefb"/><text x="290.66666666666663" y="81" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">영향 확인</text><rect x="489.48333333333323" y="65" width="119.69999999999999" height="21" fill="#fffefb"/><text x="549.3333333333333" y="81" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">대안·권고 상정</text><rect x="372.075" y="288.0" width="95.85" height="21" fill="#fffefb"/><text x="420.0" y="304.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">스폰서 결정</text><rect x="101.48333333333332" y="521.0" width="119.69999999999999" height="21" fill="#fffefb"/><text x="161.33333333333331" y="537.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">이전 기준 보존</text><rect x="367.65" y="521.0" width="104.69999999999999" height="21" fill="#fffefb"/><text x="419.99999999999994" y="537.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">승인 후 적용</text><rect x="474.48333333333323" y="581" width="149.7" height="21" fill="#fffefb"/><text x="549.3333333333333" y="597" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">같은 버전으로 업무</text></svg>