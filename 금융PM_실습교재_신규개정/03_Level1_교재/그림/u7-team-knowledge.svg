210.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">QA 측 설명</text><rect x="180.65" y="427.0" width="134.7" height="21" fill="#fffefb"/><text x="248.0" y="443.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">필요를 함께 반영</text><rect x="532.15" y="427.0" width="119.69999999999999" height="21" fill="#fffefb"/><text x="592.0" y="443.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">질문 통로 유지</text><rect x="352.65" y="487" width="134.7" height="21" fill="#fffefb"/><text x="420.0" y="503" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">합의의 효과 확인</text><rect x="180.65" y="660.0" width="134.7" height="21" fill="#fffefb"/><text x="248.0" y="676.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">현재의 시도 기록</text><rect x="520.225" y="660.0" width="143.54999999999998" height="21" fill="#fffefb"/><text x="592.0" y="676.0" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#53627a">결과 확인 후 보완</text></svg>