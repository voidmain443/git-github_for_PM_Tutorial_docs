<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 896" role="img" aria-labelledby="u7-team-knowledge-title u7-team-knowledge-desc" lang="ko"><title id="u7-team-knowledge-title">팀의 합의를 확인 가능한 교훈으로</title><desc id="u7-team-knowledge-desc">관찰한 업무 이슈：질문 대응으로 집중시간 손실、S20의 당사자 발언 확인。 개발의 필요：오전 집중시간 보호、업무 중단 조건을 살핌。 QA의 필요：모호한 명세를 당일 확인、질문할 통로가 필요。 업무 방식 합의：매일 16:30 질문 취합、이현우·정유나가 조정。 효과는 후속 확인：12월 7일 확인 예정、중단 횟수·질문 미해결 건수。 교훈 기록 · D04：조건·시도한 방식 기록、효과는 검증 대기로 표시。관찰한 업무 이슈 → 개발의 필요：개발 측 설명。 관찰한 업무 이슈 → QA의 필요：QA 측 설명。 개발의 필요 → 업무 방식 합의：필요를 함께 반영。 QA의 필요 → 업무 방식 합의：질문 통로 유지。 업무 방식 합의 → 효과는 후속 확인：합의의 효과 확인。 업무 방식 합의 → 교훈 기록 · D04：현재의 시도 기록。 효과는 후속 확인 → 교훈 기록 · D04：결과 확인 후 보완。</desc><defs><marker id="u7-team-knowledge-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="420.0,175 420.0,221.0 248.0,221.0 248.0,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u7-team-knowledge-arrow)"/><polyline points="420.0,175 420.0,221.0 592.0,221.0 592.0,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u7-team-knowledge-arrow)"/><polyline points="248.0,386 248.0,454.0 248.0,454.0 248.0,522" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u7-team-knowledge-arrow)"/><polyline points="592.0,386 592.0,454.0 248.0,454.0 248.0,522" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u7-team-knowledge-arrow)"/><polyline points="398.0,581.5 442.0,581.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u7-team-knowledge-arrow)"/><polyline points="248.0,641 248.0,687.0 420.0,687.0 420.0,733" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u7-team-knowledge-arrow)"/><polyline points="592.0,641 592.0,687.0 420.0,687.0 420.0,733" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u7-team-knowledge-arrow)"/><rect x="270.0" y="56" width="300" height="119" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="286.0" y="87" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">관찰한 업무 이슈</text><text x="286.0" y="122" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">질문 대응으로 집중시간 손실</text><text x="286.0" y="147" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">S20의 당사자 발언 확인</text><rect x="98.0" y="267" width="300" height="119" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="114.0" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">개발의 필요</text><text x="114.0" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">오전 집중시간 보호</text><text x="114.0" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">업무 중단 조건을 살핌</text><rect x="442.0" y="267" width="300" height="119" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="458.0" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">QA의 필요</text><text x="458.0" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">모호한 명세를 당일 확인</text><text x="458.0" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">질문할 통로가 필요</text><rect x="98.0" y="522" width="300" height="119" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="114.0" y="553" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold"