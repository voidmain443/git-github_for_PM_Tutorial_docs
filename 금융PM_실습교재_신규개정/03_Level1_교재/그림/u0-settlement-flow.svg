<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 543" role="img" aria-labelledby="u0-settlement-flow-title u0-settlement-flow-desc" lang="ko"><title id="u0-settlement-flow-title">정산 자료는 계산을 거쳐 비교와 후속 처리로 갑니다</title><desc id="u0-settlement-flow-desc">거래파일 수신：09:00、정산할 거래 자료를 받음。 취소 확인：09:20、계산에 반영할 취소 확인。 수수료 계산：09:40、지급예정액 계산에 반영。 지급예정 대조：10:20、은행 자료와 금액을 비교。 예외 전달：11:00、차이의 사유·담당을 연결。거래파일 수신 → 취소 확인：거래 자료。 취소 확인 → 수수료 계산：취소 반영。 수수료 계산 → 지급예정 대조：계산 결과。 지급예정 대조 → 예외 전달：확인할 차이。</desc><defs><marker id="u0-settlement-flow-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="268.66666666666663,172.0 312.66666666666663,172.0" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u0-settlement-flow-arrow)"/><polyline points="527.3333333333333,172.0 571.3333333333333,172.0" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u0-settlement-flow-arrow)"/><polyline points="678.6666666666666,244 678.6666666666666,312.0 248.0,312.0 248.0,380" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u0-settlement-flow-arrow)"/><polyline points="398.0,439.5 442.0,439.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u0-settlement-flow-arrow)"/><rect x="54.0" y="100" width="214.66666666666666" height="144" rx="4" fill="#edf2fa" stroke="#355d9e" stroke-width="1.5"/><text x="70.0" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">거래파일 수신</text><text x="70.0" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">09:00</text><text x="70.0" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">정산할 거래 자료를</text><text x="70.0" y="216" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">받음</text><rect x="312.66666666666663" y="100" width="214.66666666666666" height="144" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="328.66666666666663" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">취소 확인</text><text x="328.66666666666663" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">09:20</text><text x="328.66666666666663" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">계산에 반영할 취소</text><text x="328.66666666666663" y="216" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">확인</text><rect x="571.3333333333333" y="100" width="214.66666666666666" height="144" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="587.3333333333333" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">수수료 계산</text><text x="587.3333333333333" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">09:40</text><text x="587.3333333333333" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">지급예정액 계산에</text><text x="587.3333333333333" y="216" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">반영</text><rect x="98.0" y="380" width="300" height="119" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="114.0" y="411" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="