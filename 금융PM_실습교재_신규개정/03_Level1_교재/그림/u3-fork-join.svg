<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 666" role="img" aria-labelledby="u3-fork-join-title u3-fork-join-desc" lang="ko"><title id="u3-fork-join-title">합류점 E는 더 늦게 끝나는 선행을 기다립니다</title><desc id="u3-fork-join-desc">B 설계：기간 10영업일、A 이후 시점 20에 종료。 C 조회개발：기간 15영업일、ES 20 → EF 35、총여유 5영업일。 D 대사·예외：기간 20영업일、ES 20 → EF 40。 E 통합검증：C와 D의 결과가 모두 필요、ES=max(35,40)=40。B 설계 → C 조회개발：FS·지연0。 B 설계 → D 대사·예외：FS·지연0。 C 조회개발 → E 통합검증：시점 35에 준비。 D 대사·예외 → E 통합검증：시점 40에 준비。</desc><defs><marker id="u3-fork-join-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="420.0,175 420.0,221.0 248.0,221.0 248.0,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u3-fork-join-arrow)"/><polyline points="420.0,175 420.0,221.0 592.0,221.0 592.0,267" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u3-fork-join-arrow)"/><polyline points="248.0,411 248.0,457.0 420.0,457.0 420.0,503" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u3-fork-join-arrow)"/><polyline points="592.0,411 592.0,457.0 420.0,457.0 420.0,503" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u3-fork-join-arrow)"/><rect x="270.0" y="56" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="286.0" y="87" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">B 설계</text><text x="286.0" y="122" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">기간 10영업일</text><text x="286.0" y="147" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">A 이후 시점 20에 종료</text><rect x="98.0" y="267" width="300" height="144" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="114.0" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">C 조회개발</text><text x="114.0" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">기간 15영업일</text><text x="114.0" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">ES 20 → EF 35</text><text x="114.0" y="383" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">총여유 5영업일</text><rect x="442.0" y="267" width="300" height="144" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="458.0" y="298" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">D 대사·예외</text><text x="458.0" y="333" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">기간 20영업일</text><text x="458.0" y="358" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">ES 20 → EF 40</text><rect x="270.0" y="503" width="300" height="119" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="286.0" y="534" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">E 통합검증</text><text x="286.0" y="569" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">C와 D의 결과가 모두 필요</text><text x="286.0" y="594" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">ES=max(35,40)=40</text><rect x="209.3" y="194.0" width="77.39999999999999" height="21" fill="#fffefb"/><text x="248.0" y="210.0" font-family="Na