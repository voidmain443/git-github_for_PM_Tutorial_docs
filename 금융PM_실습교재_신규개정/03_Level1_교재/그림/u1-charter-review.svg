<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 543" role="img" aria-labelledby="u1-charter-review-title u1-charter-review-desc" lang="ko"><title id="u1-charter-review-title">검토는 내용을, 승인은 착수 권한을 확인합니다</title><desc id="u1-charter-review-desc">PM의 초안：D01 v0.1、근거·판단·미확정을 구분。 역할별 검토：운영·재무·보안·QA、목표·자금·경계·시험 확인。 PM의 수정본：D01 v0.2、의견·수정 이유·근거 보존。 승인 상정：검토 충족 여부를 대조、현재 상태: 승인 대기。 윤서진의 결정：착수와 PM 권한의 승인、결과는 이후 자료로 확인。PM의 초안 → 역할별 검토：검토 요청。 역할별 검토 → PM의 수정본：의견 반영。 PM의 수정본 → 승인 상정：조건 충족 확인。 승인 상정 → 윤서진의 결정：권한 있는 결정 요청。</desc><defs><marker id="u1-charter-review-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#53627a"/></marker></defs><polyline points="268.66666666666663,172.0 312.66666666666663,172.0" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u1-charter-review-arrow)"/><polyline points="527.3333333333333,172.0 571.3333333333333,172.0" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u1-charter-review-arrow)"/><polyline points="678.6666666666666,244 678.6666666666666,312.0 248.0,312.0 248.0,380" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u1-charter-review-arrow)"/><polyline points="398.0,439.5 442.0,439.5" fill="none" stroke="#53627a" stroke-width="1.7" marker-end="url(#u1-charter-review-arrow)"/><rect x="54.0" y="100" width="214.66666666666666" height="144" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="70.0" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">PM의 초안</text><text x="70.0" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">D01 v0.1</text><text x="70.0" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">근거·판단·미확정을</text><text x="70.0" y="216" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">구분</text><rect x="312.66666666666663" y="100" width="214.66666666666666" height="144" rx="4" fill="#fbf0df" stroke="#916323" stroke-width="1.5"/><text x="328.66666666666663" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">역할별 검토</text><text x="328.66666666666663" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">운영·재무·보안·QA</text><text x="328.66666666666663" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">목표·자금·경계·시험</text><text x="328.66666666666663" y="216" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">확인</text><rect x="571.3333333333333" y="100" width="214.66666666666666" height="144" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="587.3333333333333" y="131" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="20" font-weight="bold" text-anchor="start" fill="#26334d">PM의 수정본</text><text x="587.3333333333333" y="166" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">D01 v0.2</text><text x="587.3333333333333" y="191" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">의견·수정 이유·근거</text><text x="587.3333333333333" y="216" font-family="NanumGothic, Apple SD Gothic Neo, sans-serif" font-size="17" font-weight="normal" text-anchor="start" fill="#53627a">보존</text><rect x="98.0" y="380" width="300" height="119" rx="4" fill="#fffefb" stroke="#64728a" stroke-width="1.5"/><text x="114.0" y="411" font-family="NanumGothic, Apple SD Gothic Ne